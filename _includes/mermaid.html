<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
  (function () {
    var codeBlocks = Array.prototype.filter.call(
      document.querySelectorAll("pre > code"),
      function (code) {
        return /\blanguage-mermaid\b/i.test(code.className);
      }
    );

    if (!codeBlocks.length || !window.mermaid) {
      return;
    }

    codeBlocks.forEach(function (code) {
      var graph = document.createElement("div");
      graph.className = "mermaid";
      graph.textContent = code.textContent;
      code.parentNode.replaceWith(graph);
    });

    window.mermaid.initialize({
      startOnLoad: false,
      theme: window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "default"
    });

    window.mermaid.run({ nodes: document.querySelectorAll(".mermaid") }).catch(function (error) {
      console.error("Mermaid render failed:", error);
    });
  })();
</script>
